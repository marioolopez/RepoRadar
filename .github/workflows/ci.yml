#pipeline de integración continua de SentinelForge
name: RepoRadar CI

#ejecutamos el pipeline cuando subimos cambios
#y cuando abrimos o actualizamos una Pull Request.
on:
  push:
  pull_request:
  workflow_dispatch:

#permisos mínimos: solo necesitamos leer el repositorio.
permissions:
  contents: read

jobs:

  #PRIMER TRABAJO: PRUEBAS DEL BACKEND
  backend-tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      #URL ficticia para inicializar SQLAlchemy.
      #Las pruebas utilizan SQLite, no PostgreSQL.
      DATABASE_URL: postgresql://sentinel:dummy@localhost:5432/sentinelforge

    steps:

      #Descargamos el código del repositorio
      - name: Obtener código
        uses: actions/checkout@v6

      #Instalamos Python
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      #Instalamos nuestras dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      #Ejecutamos nuestras cinco pruebas
      - name: Ejecutar Pytest
        run: python -m pytest -v tests/test_analisis.py


  #SEGUNDO TRABAJO: COMPILACIÓN DEL FRONTEND
  frontend-build:
    name: Compilación del frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Obtener código
        uses: actions/checkout@v6

      #Instalamos Node.js
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      #Instalamos exactamente las dependencias del lockfile
      - name: Instalar dependencias
        run: npm ci

      #Compilamos TypeScript y React
      - name: Compilar frontend
        run: npm run build