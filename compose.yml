#ARCHIVO QUE SE UTILIZA PARA DAR DE ALTA CONTENEDORES GRACIAS A DOCKER COMPOSE EN DOCKER DESKTOP
services:
  backend: #Servicios, rutas y todo que se encarga de configurar y analizar, tambien tenemos swagger
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCANNER_URL: http://semgrep:8001
    depends_on:
      database:
        condition: service_healthy
      semgrep:
        condition: service_started

  #Interfaz del FRONTEND con React + Vite
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  #SEMGREP -> para detectar vulnerabilidades
  semgrep:
    build:
      context: .
      dockerfile: security/scanner/Dockerfile
    restart: unless-stopped


  #Base de datos que utilizo
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: